      '</div></div>' +
      '<div class="field"><label>Legg til egen kølle (valgfritt)</label>' +
      '<div class="row"><input type="text" id="ob-custom-club" placeholder="F.eks. 60-graders wedge" />' +
      '<button class="btn btn-sm" data-action="ob-add-custom" style="flex:0 0 auto;">Legg til</button></div>' +
      '<div class="chip-wrap" id="ob-custom-list" style="margin-top:8px;"></div>' +
      '</div>' +
      '<button class="btn btn-primary" data-action="ob-finish">Kom i gang</button>' +
      '</div></div>';
  }

  var obCustomClubs = [];
  function renderObCustomList() {
    var wrap = document.getElementById("ob-custom-list");
    if (!wrap) return;
    wrap.innerHTML = obCustomClubs.map(function (c, i) {
      return '<span class="chip">' + esc(c) + '<button data-action="ob-remove-custom" data-idx="' + i + '">×</button></span>';
    }).join("");
  }
  function bindOnboarding() {
    obCustomClubs = [];
    document.querySelector('[data-action="ob-add-custom"]').addEventListener("click", function () {
      var input = document.getElementById("ob-custom-club");
      var v = input.value.trim();
      if (v) { obCustomClubs.push(v); input.value = ""; renderObCustomList(); }
    });
    document.getElementById("ob-custom-list").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-action='ob-remove-custom']");
      if (!btn) return;
      obCustomClubs.splice(Number(btn.dataset.idx), 1);
      renderObCustomList();
    });
    document.getElementById("app-root").querySelector('[data-action="ob-finish"]').addEventListener("click", function () {
      var name = document.getElementById("ob-name").value.trim() || "Spiller";
      var picked = Array.prototype.slice.call(document.querySelectorAll(".ob-club-cb:checked")).map(function (cb) { return cb.value; });
      var all = picked.concat(obCustomClubs);
      if (!all.length) all = ["Driver", "Putter"];
      state.profile = { name: name, clubs: all.map(function (c) { return { id: uid(), name: c }; }) };
      saveProfile();
      state.route = "home";
      render();
    });
  }

  /* ---- home ---- */
  function renderHome() {
    var stats = computeStats(state.rounds);
    var out = "";
    if (state.active) {
      var doneHoles = state.active.holes.filter(function (h) { return h.par; }).length;
      out += '<div class="banner"><strong>Du har en runde i gang</strong><span>' + esc(state.active.course || "Ukjent bane") + ' — hull ' + (state.active.cursor + 1) + '/18 (' + doneHoles + ' registrert)</span>' +
        '<div class="row"><button class="btn btn-primary btn-sm" data-action="continue-round">Fortsett</button>' +
        '<button class="btn btn-danger btn-sm" data-action="discard-round">Forkast</button></div></div>';
    } else {
      out += '<button class="btn btn-primary" data-action="new-round">+ Registrer ny runde</button>';
    }
    out += '<button class="btn" data-action="nav" data-route="range">🎯 Registrer driving range</button>';
    out += '<div class="stat-grid">' +
      statTile(stats.roundsCount, "Runder") +
      statTile(stats.fairwayPct == null ? "–" : round1(stats.fairwayPct) + "%", "Fairway-treff") +
      statTile(stats.avgPuttsPerHole == null ? "–" : round2(stats.avgPuttsPerHole), "Snitt putter/hull") +
      '</div>';
    out += '<div class="card">';
    out += '<div class="section-title">Tidligere runder</div>';
    if (!state.rounds.length) {
      out += '<div class="empty">🏌️ Ingen runder registrert ennå.<br>Trykk "+ Registrer ny runde" for å komme i gang.</div>';
    } else {
      var sorted = state.rounds.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
      out += sorted.map(function (r) {
        var s = computeStats([r]);
        return '<div class="list-row"><div data-action="open-round" data-id="' + r.id + '" style="cursor:pointer;">' +
          '<div>' + esc(r.date || "") + (r.course ? " — " + esc(r.course) : "") + '</div>' +
          '<div class="meta">' + s.holesCount + ' hull · ' + s.totalPutts + ' putter' + (s.fairwayPct != null ? " · " + round1(s.fairwayPct) + "% fairway" : "") + '</div></div>' +
          '<button class="btn-ghost btn btn-sm" data-action="open-round" data-id="' + r.id + '">Åpne</button></div>';
      }).join("");
    }
    out += '</div>';
    out += '<button class="btn btn-ghost" data-action="nav" data-route="settings">⚙️ Innstillinger og køllebag</button>';
    return out;
  }
  function statTile(value, label) {
    return '<div class="stat-tile"><div class="value">' + value + '</div><div class="label">' + label + '</div></div>';
  }

  /* ---- active round entry ---- */
  function ensureActiveRound() {
    if (!state.active) {
      var holes = [];
      for (var i = 1; i <= 18; i++) holes.push({ n: i, par: null, shots: [], puttMode: "enkel", enkelCount: 2, puttDetails: [{ dist: "", flag: "" }, { dist: "", flag: "" }], putts: 0 });
      state.active = {
        id: uid(),
        date: new Date().toISOString().slice(0, 10),
        course: "",
        courseId: null,
        hagaFront: null,
        hagaBack: null,
        courseConfirmed: false,
        cursor: 0,
        holes: holes
      };
      saveActive();
    }
  }

  function findPresetCourse(id) {
    return PRESET_COURSES.find(function (c) { return c.id === id; }) || null;
  }
  function applyPresetPars(preset) {
    preset.pars.forEach(function (p, i) { state.active.holes[i].par = p; });
    state.active.course = preset.name;
  }
  function applyHagaPars() {
    var haga = findPresetCourse("haga");
    var front = haga.loops.find(function (l) { return l.id === state.active.hagaFront; });
    var back = haga.loops.find(function (l) { return l.id === state.active.hagaBack; });
    if (front) front.pars.forEach(function (p, i) { state.active.holes[i].par = p; });
    if (back) back.pars.forEach(function (p, i) { state.active.holes[9 + i].par = p; });
    state.active.course = "Haga Golfklubb (" + (front ? front.label : "?") + "/" + (back ? back.label : "?") + ")";
  }

  /* ---- scorekort-notasjon: par = tall, birdie = sirkel, eagle = dobbel sirkel,
     bogey = firkant, dobbelbogey (eller verre) = dobbel firkant ---- */
  function scoreKind(strokes, par) {
    if (!par || !strokes) return null;
    var diff = strokes - par;
    if (diff <= -2) return "eagle";
    if (diff === -1) return "birdie";
    if (diff === 0) return "par";
    if (diff === 1) return "bogey";
    return "dbogey";
  }
  function scoreBadgeHTML(strokes, par) {
    var kind = scoreKind(strokes, par);
    if (!kind) return '<span class="score-badge score-none">' + (strokes || "–") + "</span>";
    return '<span class="score-badge score-' + kind + '">' + strokes + "</span>";
  }
  function holeStrokes(h) {
    var n = (h.shots ? h.shots.length : 0) + shotsPenaltyCount(h) + (typeof h.putts === "number" ? h.putts : 0);
    return n > 0 ? n : null;
  }
  function renderScorecardGrid(holes) {
    function nineHTML(nine, label) {
      var totalPar = nine.reduce(function (s, h) { return s + (h.par || 0); }, 0);
      var anyPar = nine.some(function (h) { return h.par; });
      var holesRow = nine.map(function (h) {
        return '<div class="scorecard-cell"><div class="sc-hole">' + h.n + '</div></div>';
      }).join("") + '<div class="scorecard-cell sc-total-cell"><div class="sc-hole sc-total-label">Sum</div></div>';
      var parRow = nine.map(function (h) {
        return '<div class="scorecard-cell"><div class="sc-par">' + (h.par ? "Par " + h.par : "–") + '</div></div>';
      }).join("") + '<div class="scorecard-cell sc-total-cell"><div class="sc-par sc-total-value">' + (anyPar ? totalPar : "–") + '</div></div>';
      var scoreRow = nine.map(function (h) {
        var strokes = holeStrokes(h);
        return '<div class="scorecard-cell">' + (strokes && h.par ? scoreBadgeHTML(strokes, h.par) : '<span class="score-badge score-none">' + (strokes || "–") + '</span>') + '</div>';
      }).join("") + '<div class="scorecard-cell"></div>';
      return '<div class="scorecard-nine"><div class="section-title">' + label + '</div>' +
        '<div class="scorecard-scroll">' +
        '<div class="scorecard-line">' + holesRow + '</div>' +
        '<div class="scorecard-line sc-par-line">' + parRow + '</div>' +
        '<div class="scorecard-line">' + scoreRow + '</div>' +
        '</div></div>';
    }
    var totalStrokes = 0, totalPar = 0, playedCount = 0;
    holes.forEach(function (h) {
      var strokes = holeStrokes(h);
      if (strokes && h.par) { totalStrokes += strokes; totalPar += h.par; playedCount++; }
    });
    var diff = totalStrokes - totalPar;
    var diffLabel = diff === 0 ? "E" : (diff > 0 ? "+" + diff : String(diff));
    var diffCls = diff === 0 ? "" : (diff > 0 ? " sc-summary-over" : " sc-summary-under");
    var allParsKnown = holes.every(function (h) { return !!h.par; });
    var summaryHTML = "";
    if (playedCount) {
      if (allParsKnown) {
        var coursePar = holes.reduce(function (s, h) { return s + h.par; }, 0);
        var projected = coursePar + diff;
        var isComplete = playedCount === holes.length;
        var note = isComplete ? "Ferdig runde" : "Projisert sluttsum (resten av hullene regnet til par)";
        summaryHTML = '<div class="sc-summary"><span class="sc-summary-big">' + projected + "/" + coursePar + '</span>' +
          '<span class="sc-summary-diff' + diffCls + '">(' + diffLabel + ')</span>' +
          '<span class="sc-summary-note">' + note + '</span></div>';
      } else {
        summaryHTML = '<div class="sc-summary"><span>' + totalStrokes + ' slag</span><span class="sc-summary-sep">·</span><span>Par ' + totalPar + '</span><span class="sc-summary-sep">·</span><span class="sc-summary-diff' + diffCls + '">' + diffLabel + '</span>' +
          '<span class="sc-summary-note">(' + playedCount + ' av 18 hull)</span></div>';
      }
    }
    return '<div class="card scorecard">' + nineHTML(holes.slice(0, 9), "Hull 1–9") + nineHTML(holes.slice(9, 18), "Hull 10–18") +
      summaryHTML +
      '<div class="sc-legend">○ Birdie &nbsp; ○○ Eagle &nbsp; Par = tall &nbsp; □ Bogey &nbsp; □□ Dobbelbogey+</div></div>';
  }

  function clubOptionsHTML(selected) {
    var opts = '<option value=""' + (!selected ? " selected" : "") + '>Velg kølle</option>';
    opts += state.profile.clubs.map(function (c) {
      return '<option value="' + esc(c.name) + '"' + (c.name === selected ? " selected" : "") + '>' + esc(c.name) + '</option>';
    }).join("");
    return opts;
  }
  function simpleOptionsHTML(list, selected) {
    return list.map(function (o) {
      return '<option value="' + o + '"' + (o === selected ? " selected" : "") + '>' + o + '</option>';
    }).join("");
  }

  function renderRound() {
    ensureActiveRound();
    var a = state.active;
    var h = a.holes[a.cursor];
    var out = "";
    var hasValidCourseSelection = !!(a.courseId && (a.courseId !== "haga" || (a.hagaFront && a.hagaBack)));

    out += '<div class="card stack">';
    if (a.courseConfirmed && hasValidCourseSelection) {
      var confirmedHaga = a.courseId === "haga" ? findPresetCourse("haga") : null;
      var confirmedFront = confirmedHaga ? confirmedHaga.loops.find(function (l) { return l.id === a.hagaFront; }) : null;
      var confirmedBack = confirmedHaga ? confirmedHaga.loops.find(function (l) { return l.id === a.hagaBack; }) : null;
      out += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">' +
        '<div style="display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;">' +
        '<span>⛳ ' + esc(a.course) + '</span>' +
        (confirmedFront ? '<span class="loop-dot-mini" style="background:' + confirmedFront.color + ';" title="' + confirmedFront.label + '"></span>' : "") +
        (confirmedBack ? '<span class="loop-dot-mini" style="background:' + confirmedBack.color + ';" title="' + confirmedBack.label + '"></span>' : "") +
        '</div>' +
        '<button class="btn btn-ghost btn-sm" data-action="edit-course" style="flex:0 0 auto;">Bytt bane</button>' +
        '</div>';
    } else {
      out += '<div class="row"><div class="field" style="margin-bottom:0;"><label>Dato</label><input type="date" id="rd-date" value="' + esc(a.date) + '" /></div>' +
        '<div class="field" style="margin-bottom:0;"><label>Bane</label><input type="text" id="rd-course" value="' + esc(a.course) + '" placeholder="Valgfritt" /></div></div>' +
        '<div><div class="section-title">Velg bane (valgfritt)</div><div class="chip-wrap">' +
        PRESET_COURSES.map(function (c) {
          var active = a.courseId === c.id;
          return '<button class="toggle-btn' + (active ? " active" : "") + '" data-action="select-course" data-course="' + c.id + '" style="flex:0 0 auto;width:auto;padding:8px 14px;">' + esc(c.name) + '</button>';
        }).join("") +
        (a.courseId ? '<button class="toggle-btn" data-action="select-course-clear" style="flex:0 0 auto;width:auto;padding:8px 14px;">✕ Egendefinert</button>' : "") +
        '</div></div>';

      if (a.courseId === "haga") {
        var haga = findPresetCourse("haga");
        out += '<div style="margin-top:2px;"><div class="section-title">Hull 1–9 (løype)</div><div class="chip-wrap">' +
          haga.loops.map(function (l) {
            var active = a.hagaFront === l.id;
            return '<button class="loop-dot' + (active ? " active" : "") + '" data-action="select-haga-loop" data-slot="front" data-loop="' + l.id + '" style="background:' + l.color + ';" aria-label="' + l.label + '" title="' + l.label + '"></button>';
          }).join("") + '</div></div>';
        out += '<div style="margin-top:2px;"><div class="section-title">Hull 10–18 (løype)</div><div class="chip-wrap">' +
          haga.loops.map(function (l) {
            var active = a.hagaBack === l.id;
            return '<button class="loop-dot' + (active ? " active" : "") + '" data-action="select-haga-loop" data-slot="back" data-loop="' + l.id + '" style="background:' + l.color + ';" aria-label="' + l.label + '" title="' + l.label + '"></button>';
          }).join("") + '</div></div>';
      }

      if (hasValidCourseSelection) {
        out += '<button class="btn btn-primary btn-sm" data-action="confirm-course">✓ Bekreft bane</button>';
      }
    }
    out += '</div>';

    out += '<div class="hole-strip">' + a.holes.map(function (hh, idx) {
      var cls = "hole-dot" + (idx === a.cursor ? " current" : "") + (hh.par ? " done" : "");
      return '<div class="' + cls + '" data-action="goto-hole" data-idx="' + idx + '">' + hh.n + '</div>';
    }).join("") + '</div>';

    out += '<div class="card stack" id="hole-card">';
    out += '<div style="display:flex;align-items:center;justify-content:space-between;"><h3 style="margin:0;">Hull ' + h.n + ' av 18</h3>' +
      (h.par && holeStrokes(h) ? scoreBadgeHTML(holeStrokes(h), h.par) : "") + '</div>';
    out += '<div><div class="section-title">Par</div><div class="toggle-group">' +
      [3, 4, 5].map(function (p) {
        return '<button class="toggle-btn' + (h.par === p ? " active" : "") + '" data-action="set-par" data-par="' + p + '">Par ' + p + '</button>';
      }).join("") + '</div></div>';

    if (!h.par) {
      out += '<div class="empty">Velg par for å starte registrering av slag og putter.</div>';
    } else {
      if (h.par === 4 || h.par === 5) {
        out += '<div class="note-box"><b>Fairway-treff:</b> landingspunkt <b>Fairway</b> på slag 1 (utslaget) teller som fairway-treff i statistikken. Alt annet landingspunkt på slag 1 telles som bom.</div>';
      }

      out += '<div><div class="section-title">Slag før green</div>';
      buildShotSequence(h).forEach(function (item) {
        if (item.type === "penalty") {
          out += '<div class="entry penalty-entry">';
          out += '<div class="entry-head"><span class="num">Slag ' + item.num + ' · Straffeslag</span></div>';
          out += '<div class="penalty-line">Automatisk straffeslag (' + esc(item.land) + ')</div>';
          out += '<div class="lost-row"><span class="lost-label">Mistet du ballen?</span><div class="lost-toggle">' +
            ["Ja", "Nei"].map(function (v) {
              var cls = "pill-btn " + (v === "Ja" ? "lost-yes" : "lost-no") + (item.lostBall === v ? " active" : "");
              return '<button class="' + cls + '" data-action="set-lost-ball" data-i="' + item.shotRi + '" data-val="' + v + '">' + v + '</button>';
            }).join("") + '</div></div>';
          out += '</div>';
          return;
        }
        var shot = item.shot, i = item.ri;
        out += '<div class="entry">';
        out += '<div class="entry-head"><span class="num">Slag ' + item.num + (shot.len ? '  <span class="dist">· ' + esc(shot.len) + ' m</span>' : '') + '</span>';
        out += h.shots.length > 1 ? '<button class="remove-btn" data-action="remove-shot" data-i="' + i + '">×</button>' : '';
        out += '</div>';
        out += '<div class="row">' +
          '<div class="field" style="margin-bottom:0;"><label>Kølle</label><select data-action="shot-club" data-i="' + i + '">' + clubOptionsHTML(shot.club) + '</select></div>' +
          '<div class="field" style="margin-bottom:0;max-width:92px;"><label>Lengde (m)</label><input type="number" inputmode="decimal" value="' + esc(shot.len || "") + '" data-action="shot-len" data-i="' + i + '" /></div>' +
          '</div>';
        out += '<div class="row" style="margin-top:8px;">' +
          '<div class="field" style="margin-bottom:0;"><label>Slagtype</label><select data-action="shot-type" data-i="' + i + '">' + simpleOptionsHTML(SHOT_TYPES, shot.type) + '</select></div>' +
          '<div class="field" style="margin-bottom:0;"><label>Landingspunkt</label><select data-action="shot-land" data-i="' + i + '">' + simpleOptionsHTML(LANDING_SPOTS, shot.land) + '</select></div>' +
          '</div>';
        if (shot.land === "Hazard") {
          out += '<div class="drop-row"><span class="drop-label">Droppet ballen (gir straffeslag)?</span><div class="drop-toggle">' +
            ["Ja", "Nei"].map(function (v) {
              var cls = "pill-btn" + (v === "Ja" ? " drop-yes" : "") + (shot.drop === v ? " active" : "");
              return '<button class="' + cls + '" data-action="set-drop" data-i="' + i + '" data-val="' + v + '">' + v + '</button>';
            }).join("") + '</div></div>';
          if (shot.drop !== "Ja") {
            out += '<div class="hazard-note">Ingen straffeslag — neste slag spilles fra hazard.</div>';
          }
        }
        out += '</div>';
      });
      out += '<button class="add-btn" data-action="add-shot">+ Legg til slag</button></div>';

      out += '<div><div class="section-title">Putter</div>';
      out += '<div class="mode-toggle">' +
        '<button class="mode-btn' + (h.puttMode !== "detaljert" ? " active" : "") + '" data-action="set-putt-mode" data-mode="enkel">Enkel</button>' +
        '<button class="mode-btn' + (h.puttMode === "detaljert" ? " active" : "") + '" data-action="set-putt-mode" data-mode="detaljert">Detaljert</button>' +
        '</div>';
      if (h.puttMode === "detaljert") {
        var visible = visiblePutts(h);
        visible.forEach(function (putt, i) {
          out += '<div class="putt-entry">';
          out += '<div class="entry-head"><span class="num">Putt ' + (i + 1) + '</span>';
          out += (i > 0 && !putt.flag) ? '<button class="remove-btn" data-action="remove-putt" data-i="' + i + '">×</button>' : '';
          out += '</div>';
          out += '<div class="putt-row">' +
            '<div class="field grow" style="margin-bottom:0;"><label>Distanse til hull (m)</label><input type="number" inputmode="decimal" value="' + esc(putt.dist || "") + '" data-action="putt-dist" data-i="' + i + '" /></div>' +
            '<div class="putt-result">' + ["Gimme", "Tap-in", "Made"].map(function (r) {
              return '<button class="pill-btn' + (putt.flag === r ? " active" : "") + '" data-action="putt-flag" data-i="' + i + '" data-val="' + r + '">' + r + '</button>';
            }).join("") + '</div></div>';
          if (putt.flag === "Gimme" || putt.flag === "Tap-in") {
            out += '<div class="flag-note">+ 1 automatisk slag (' + putt.flag + ')</div>';
          }
          out += '</div>';
        });
        var lastFlag = visible.length && visible[visible.length - 1].flag;
        if (!lastFlag) {
          out += '<button class="add-btn" data-action="add-putt">+ Legg til putt</button>';
        }
      } else {
        out += '<div class="toggle-group" style="margin-top:8px;">' + [1, 2, 3, 4, 5].map(function (n) {
          return '<button class="toggle-btn' + (h.enkelCount === n ? " active" : "") + '" data-action="set-enkel-count" data-n="' + n + '">' + n + '</button>';
        }).join("") + '</div>';
      }
      out += '</div>';
    }

    out += '<div class="row">' +
      '<button class="btn" data-action="prev-hole"' + (a.cursor === 0 ? " disabled" : "") + '>‹ Forrige</button>' +
      (a.cursor === 17
        ? '<button class="btn btn-primary" data-action="finish-round">Fullfør runde ✔</button>'
        : '<button class="btn btn-primary" data-action="next-hole">Neste ›</button>') +
      '</div>';

    out += renderScorecardGrid(a.holes);
    out += '<button class="btn btn-ghost" data-action="discard-round">Forkast runden</button>';
    return out;
  }

  /* ---- round detail (finished) ---- */
  function renderRoundDetail(id) {
    var r = state.rounds.find(function (x) { return x.id === id; });
    if (!r) return '<div class="empty">Fant ikke runden.</div>';
    var s = computeStats([r]);
    var out = '<div class="card">' +
      '<h3>' + esc(r.date) + (r.course ? " — " + esc(r.course) : "") + '</h3>' +
      '<div class="meta">' + s.holesCount + ' hull registrert · ' + s.totalPutts + ' putter' + (s.fairwayPct != null ? " · " + round1(s.fairwayPct) + "% fairway" : "") + (s.girPct != null ? " · " + round1(s.girPct) + "% GIR" : "") + (s.lostBalls ? " · " + s.lostBalls + " tapt(e) ball(er)" : "") + '</div>' +
      '</div>';
    out += renderScorecardGrid(r.holes);
    out += '<div class="card">';
    out += r.holes.filter(function (h) { return h.par; }).map(function (h) {
      var strokes = holeStrokes(h);
      var narrative = holeNarrative(h);
      if (!narrative) {
        var fairwayNote = (h.par === 4 || h.par === 5) ? (holeFairwayHit(h) ? "Fairway ✅" : "Fairway ❌") + " · " : "";
        narrative = fairwayNote + (h.putts || 0) + " putter";
      }
      return '<div class="list-row"><div><div>Hull ' + h.n + ' · Par ' + h.par + '</div>' +
        '<div class="meta">' + esc(narrative) +
        '</div></div>' + (strokes ? scoreBadgeHTML(strokes, h.par) : "") + '</div>';
    }).join("");
    out += '</div>';
    out += '<button class="btn btn-danger" data-action="delete-round" data-id="' + r.id + '">Slett runde</button>';
    out += '<button class="btn btn-ghost" data-action="nav" data-route="home">‹ Tilbake</button>';
    return out;
  }

  /* ---- driving range ---- */
  function renderRange() {
    var power = state.rangeForm.power;
    if (!state.rangeForm.club || !state.profile.clubs.some(function (c) { return c.name === state.rangeForm.club; })) {
      state.rangeForm.club = state.profile.clubs.length ? state.profile.clubs[0].name : null;
    }
    var selectedClub = state.rangeForm.club;
    var out = '<div class="card stack">';
    out += '<p style="font-size:13px;color:var(--text-secondary);">Registrer lengder på driving range for å bygge bedre kølledata – uavhengig av om du spiller en runde.</p>';
    out += '<div><div class="section-title">Kølle</div><div class="chip-wrap">' +
      state.profile.clubs.map(function (c) {
        var active = c.name === selectedClub;
        return '<button class="toggle-btn' + (active ? " active" : "") + '" data-action="range-set-club" data-club="' + esc(c.name) + '" style="flex:0 0 auto;width:auto;padding:8px 14px;">' + esc(c.name) + '</button>';
      }).join("") + '</div></div>';
    out += '<div><div class="section-title">Slagkraft</div><div class="toggle-group">' +
      [100, 75, 50].map(function (p) {
        return '<button class="toggle-btn' + (power === p ? " active" : "") + '" data-action="range-set-power" data-power="' + p + '">' + (p === 100 ? "Fullt slag" : p + "%") + '</button>';
      }).join("") + '</div></div>';
    out += '<div class="row"><input type="number" inputmode="decimal" id="range-len-input" placeholder="Lengde (m)" />' +
      '<button class="btn btn-primary btn-sm" data-action="range-add-shot" style="flex:0 0 auto;">Legg til</button></div>';
    out += '</div>';

    out += '<div class="card">';
    out += '<div class="section-title">Nylig registrert</div>';
    var recent = state.rangeShots.slice().reverse().slice(0, 20);
    if (!recent.length) {
      out += '<div class="empty">Ingen driving range-slag registrert ennå.</div>';
    } else {
      out += recent.map(function (s) {
        var label = s.power === 100 ? "Fullt slag" : s.power + "%";
        return '<div class="list-row"><div>' + esc(s.club) + ' <span class="badge">' + label + '</span></div>' +
          '<div class="row" style="flex:0 0 auto;align-items:center;gap:10px;"><span>' + s.len + ' m</span>' +
          '<button class="btn-ghost btn btn-sm" data-action="range-remove-shot" data-id="' + s.id + '">×</button></div></div>';
      }).join("");
    }
    out += '</div>';
    out += '<button class="btn btn-ghost" data-action="nav" data-route="stats">📊 Se samlet statistikk</button>';
    return out;
  }

  /* ---- stats ---- */
  function renderStats() {
    var stats = computeStats(state.rounds);
    var scoreByPar = computeScoreByPar(state.rounds);
    var clubBreakdown = computeClubBreakdown(state.rounds, state.rangeShots);
    var out = '<div class="stat-grid">' +
      statTile(stats.roundsCount, "Runder") +
      statTile(stats.fairwayPct == null ? "–" : round1(stats.fairwayPct) + "%", "Fairway-treff") +
      statTile(stats.girPct == null ? "–" : round1(stats.girPct) + "%", "GIR") +
      statTile(stats.avgPuttsPerHole == null ? "–" : round2(stats.avgPuttsPerHole), "Snitt putter/hull") +
      statTile(stats.lostBalls, "Tapte baller") +
      '</div>';

    out += '<div class="card">';
    out += '<div class="section-title">Snittscore per hulltype</div>';
    out += '<div class="stat-grid">' + [3, 4, 5].map(function (par) {
      var g = scoreByPar[par];
      if (!g.n) return statTile("–", "Par " + par);
      var avg = g.sum / g.n;
      var diff = avg - par;
      var diffLabel = (diff >= 0 ? "+" : "") + round1(diff);
      return statTile(round2(avg) + '<span style="font-size:11px;color:var(--text-muted);"> (' + diffLabel + ')</span>', "Par " + par + " (" + g.n + " hull)");
    }).join("") + '</div>';
    out += '</div>';

    out += '<div class="card">';
    out += '<div class="section-title">Snittlengde per kølle (fullt slag)</div>';
    var withFull = clubBreakdown.filter(function (c) { return c.full.n > 0; });
    if (!withFull.length) {
      out += '<div class="empty">Ingen slag registrert ennå – legg inn en runde eller besøk driving range.</div>';
    } else {
      var max = Math.max.apply(null, withFull.map(function (c) { return c.full.avg; }));
      out += withFull.map(function (c) {
        var pct = max ? (c.full.avg / max) * 100 : 0;
        return '<div class="bar-row"><div class="bar-label"><span>' + esc(c.name) + ' <span class="badge">' + c.full.n + ' slag</span></span><span>' + round1(c.full.avg) + ' m</span></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;"></div></div></div>';
      }).join("");
    }
    out += '</div>';

    out += '<div class="card">';
    out += '<div class="section-title">Antall registrert per slagtype</div>';
    var shotTypeBreakdown = computeShotTypeBreakdown(state.rounds);
    if (!shotTypeBreakdown.length) {
      out += '<div class="empty">Ingen slag registrert ennå.</div>';
    } else {
      var maxTypeN = shotTypeBreakdown[0].n;
      out += shotTypeBreakdown.map(function (t) {
        var pct = maxTypeN ? (t.n / maxTypeN) * 100 : 0;
        return '<div class="bar-row"><div class="bar-label"><span>' + esc(t.type) + '</span><span>' + t.n + '</span></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;"></div></div></div>';
      }).join("");
    }
    out += '</div>';

    var withPartial = clubBreakdown.filter(function (c) { return c.p75.n > 0 || c.p50.n > 0; });
    if (withPartial.length) {
      out += '<div class="card">';
      out += '<div class="section-title">Lengde etter slagkraft (fra driving range)</div>';
      out += '<table class="pair-table"><thead><tr><th>Kølle</th><th>Fullt</th><th>75%</th><th>50%</th></tr></thead><tbody>';
      out += withPartial.map(function (c) {
        function cell(b) { return b.n ? round1(b.avg) + ' m <span class="badge">' + b.n + '</span>' : '–'; }
        return '<tr><td>' + esc(c.name) + '</td><td>' + cell(c.full) + '</td><td>' + cell(c.p75) + '</td><td>' + cell(c.p50) + '</td></tr>';
      }).join("") + '</tbody></table>';
      out += '</div>';
    }
    out += '<button class="btn btn-ghost" data-action="nav" data-route="range">🎯 Registrer på driving range</button>';

    out += '<div class="card stack">';
    out += '<div class="section-title">Eksporter mine tall</div>';
    out += '<p style="font-size:13px;color:var(--text-secondary);">Del denne koden med de andre i gruppa (SMS, e-post e.l.) så kan dere finne gode makkerpar i "Sammenlign".</p>';
    var code = EXPORT_PREFIX + toBase64(buildExportObject());
    out += '<code class="export-code" id="export-code-box">' + esc(code) + '</code>';
    out += '<div class="row"><button class="btn btn-sm" data-action="copy-export">📋 Kopier kode</button>' +
      '<button class="btn btn-sm" data-action="download-export">⬇️ Last ned fil</button></div>';
    out += '</div>';
    return out;
  }

  /* ---- compare ---- */
  function parseCompareInput() {
    var lines = state.compareInput.split("\n");
    var players = [], errors = [];
    lines.forEach(function (line, idx) {
      var trimmed = line.trim();
      if (!trimmed) return;
      try {
        players.push(parseExportCode(trimmed));
      } catch (e) {
        errors.push("Linje " + (idx + 1) + ": " + e.message);
      }
    });
    state.comparePlayers = players;
    state.compareErrors = errors;
  }

  function renderCompare() {
    var out = '<div class="card stack">';
    out += '<div class="section-title">Lim inn eksportkoder</div>';
    out += '<p style="font-size:13px;color:var(--text-secondary);">Én kode per linje. Hver spiller finner sin kode under "Statistikk".</p>';
    out += '<textarea id="cmp-input" placeholder="GOLF1:....">' + esc(state.compareInput) + '</textarea>';
    out += '<div class="row"><button class="btn btn-primary btn-sm" data-action="cmp-parse">Tolk koder</button>' +
      '<button class="btn btn-sm" data-action="cmp-add-self">+ Legg til meg selv</button></div>';
    if (state.compareErrors.length) {
      out += '<div class="banner" style="border-color:var(--danger);background:var(--danger-soft);">' +
        state.compareErrors.map(esc).join("<br/>") + '</div>';
    }
    out += '</div>';

    if (state.comparePlayers.length) {
      out += '<div class="card">';
      out += '<div class="section-title">Spillere i sammenligningen</div>';
      out += state.comparePlayers.map(function (p, i) {
        return '<div class="list-row"><div><div>' + esc(p.name) + '</div>' +
          '<div class="meta">' + (p.fairwayPct != null ? p.fairwayPct + "% fairway" : "–") + ' · ' + (p.avgPutts != null ? p.avgPutts + " putter/hull" : "–") + '</div></div>' +
          '<button class="btn-ghost btn btn-sm" data-action="cmp-remove" data-idx="' + i + '">Fjern</button></div>';
      }).join("");
      out += '</div>';
    }

    if (state.comparePlayers.length >= 2) {
      var pairs = computePairings(state.comparePlayers);
      ["scramble", "greensome", "shamble"].forEach(function (fmt) {
        var label = { scramble: "Scramble", greensome: "Greensome", shamble: "Shamble" }[fmt];
        var sorted = pairs.slice().sort(function (a, b) { return b[fmt] - a[fmt]; });
        out += '<div class="card">';
        out += '<div class="section-title">Beste par — ' + label + '</div>';
        out += '<table class="pair-table"><thead><tr><th>Par</th><th>Poeng</th></tr></thead><tbody>' +
          sorted.map(function (p) {
            return '<tr><td>' + esc(p.a) + ' + ' + esc(p.b) + '</td><td class="score-pill">' + p[fmt] + '</td></tr>';
          }).join("") + '</tbody></table>';
        out += '</div>';
      });
      out += '<p style="font-size:12px;color:var(--text-muted);padding:0 4px;">Poengene (0–100) er en forenklet startmodell basert på relativ lengde, fairway-treff og putting i gruppa – bruk det som en pekepinn, ikke en fasit.</p>';
    } else if (state.comparePlayers.length === 1) {
      out += '<div class="empty">Legg til minst én spiller til for å se makkerpar-forslag.</div>';
    }
    return out;
  }

  /* ---- settings ---- */
  function renderSettings() {
    var out = '<div class="card stack">';
    out += '<div class="field"><label>Navn</label><input type="text" id="st-name" value="' + esc(state.profile.name) + '" /></div>';
    out += '<div class="section-title">Køllebag</div>';
    out += '<div class="chip-wrap" id="st-club-list">' + state.profile.clubs.map(function (c) {
      return '<span class="chip">' + esc(c.name) + '<button data-action="remove-club" data-id="' + c.id + '">×</button></span>';
    }).join("") + '</div>';
    out += '<div class="row"><input type="text" id="st-new-club" placeholder="Ny kølle" />' +
      '<button class="btn btn-sm" data-action="add-club" style="flex:0 0 auto;">Legg til</button></div>';
    out += '<button class="btn btn-primary" data-action="save-settings">Lagre</button>';
    out += '</div>';
    out += '<button class="btn btn-ghost" data-action="nav" data-route="home">‹ Tilbake</button>';
    return out;
  }

  /* ---------------- event handling ---------------- */
  function bindGlobal() {
    root.addEventListener("click", handleClick);
    root.addEventListener("input", handleInput);
  }

  /* Tekst-/tallfelt i den detaljerte slag-/puttregistreringen lagres direkte i
     state uten å trigge et helt re-render (som ville stjålet fokus midt i tasting) —
     samme prinsipp som dato/bane-feltene lenger opp (syncRoundMeta). Landingspunkt
     er unntaket: det endrer straffeslag/nummerering/hazard-spørsmål, så det MÅ
     re-rendere for å vise resultatet. */
  function handleInput(e) {
    var el = e.target.closest("[data-action]");
    if (!el || !state.active) return;
    var action = el.dataset.action;
    var h = state.active.holes[state.active.cursor];
    if (!h) return;
    var i = Number(el.dataset.i);
    if (action === "shot-club") { h.shots[i].club = el.value; saveActive(); return; }
    if (action === "shot-type") { h.shots[i].type = el.value; saveActive(); return; }
    if (action === "shot-len") { h.shots[i].len = el.value; saveActive(); return; }
    if (action === "shot-land") { h.shots[i].land = el.value; saveActive(); render(); return; }
    if (action === "putt-dist") { h.puttDetails[i].dist = el.value; saveActive(); return; }
  }

  function handleClick(e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.dataset.action;

    if (action === "unlock-attempt") {
      var codeInput = document.getElementById("lock-code-input");
      var entered = (codeInput.value || "").trim().toLowerCase();
      if (entered === ACCESS_CODE.toLowerCase()) {
        state.unlocked = true;
        writeJSON(LS.unlocked, true);
        render();
      } else {
        showToast("Feil kode, prøv igjen");
        codeInput.value = "";
        codeInput.focus();
      }
      return;
    }

    if (action === "nav") { state.route = el.dataset.route; render(); return; }
    if (action === "new-round") { state.active = null; ensureActiveRound(); state.route = "round"; render(); return; }
    if (action === "continue-round") { state.route = "round"; render(); return; }
    if (action === "discard-round") {
      state.active = null; writeJSON(LS.active, null); state.route = "home"; render(); return;
    }
    if (action === "open-round") { state.route = "roundDetail"; state.routeParams = { id: el.dataset.id }; render(); return; }
    if (action === "delete-round") {
      state.rounds = state.rounds.filter(function (r) { return r.id !== el.dataset.id; });
      saveRounds(); state.route = "home"; render(); showToast("Runde slettet"); return;
    }

    if (action === "select-course") {
      var preset = findPresetCourse(el.dataset.course);
      if (!preset) return;
      state.active.courseId = preset.id;
      if (preset.loops) {
        state.active.course = preset.name;
        if (state.active.hagaFront && state.active.hagaBack) applyHagaPars();
      } else {
        applyPresetPars(preset);
      }
      saveActive(); render(); return;
    }
    if (action === "select-course-clear") {
      state.active.courseId = null; state.active.hagaFront = null; state.active.hagaBack = null; state.active.courseConfirmed = false;
      saveActive(); render(); return;
    }
    if (action === "select-haga-loop") {
      if (el.dataset.slot === "front") state.active.hagaFront = el.dataset.loop;
      else state.active.hagaBack = el.dataset.loop;
      applyHagaPars();
      saveActive(); render(); return;
    }
    if (action === "confirm-course") {
      state.active.courseConfirmed = true;
      seedHoleDefaults(state.active.holes[state.active.cursor]);
      saveActive(); render(); return;
    }
    if (action === "edit-course") { state.active.courseConfirmed = false; saveActive(); render(); return; }

    if (action === "goto-hole") {
      state.active.cursor = Number(el.dataset.idx);
      seedHoleDefaults(state.active.holes[state.active.cursor]);
      saveActive(); render(); return;
    }
    if (action === "set-par") {
      var h = state.active.holes[state.active.cursor];
      h.par = Number(el.dataset.par);
      seedHoleDefaults(h);
      saveActive(); render(); return;
    }
    if (action === "add-shot") {
      state.active.holes[state.active.cursor].shots.push({ club: "", len: "", type: "Sweetspot", land: "Fairway" });
      saveActive(); render(); return;
    }
    if (action === "remove-shot") {
      state.active.holes[state.active.cursor].shots.splice(Number(el.dataset.i), 1);
      saveActive(); render(); return;
    }
    if (action === "set-drop") {
      var dsh = state.active.holes[state.active.cursor].shots[Number(el.dataset.i)];
      dsh.drop = dsh.drop === el.dataset.val ? "" : el.dataset.val;
      saveActive(); render(); return;
    }
    if (action === "set-lost-ball") {
      var lsh = state.active.holes[state.active.cursor].shots[Number(el.dataset.i)];
      lsh.lostBall = lsh.lostBall === el.dataset.val ? "" : el.dataset.val;
      saveActive(); render(); return;
    }
    if (action === "set-putt-mode") {
      var pmh = state.active.holes[state.active.cursor];
      pmh.puttMode = el.dataset.mode;
      syncPutts(pmh);
      saveActive(); render(); return;
    }
    if (action === "set-enkel-count") {
      var ech = state.active.holes[state.active.cursor];
      ech.enkelCount = Number(el.dataset.n);
      syncPutts(ech);
      saveActive(); render(); return;
    }
    if (action === "add-putt") {
      var aph = state.active.holes[state.active.cursor];
      if (!aph.puttDetails) aph.puttDetails = [];
      aph.puttDetails.push({ dist: "", flag: "" });
      saveActive(); render(); return;
    }
    if (action === "remove-putt") {
      var rph = state.active.holes[state.active.cursor];
      rph.puttDetails.splice(Number(el.dataset.i), 1);
      syncPutts(rph);
      saveActive(); render(); return;
    }
    if (action === "putt-flag") {
      var pfh = state.active.holes[state.active.cursor];
      var putt = pfh.puttDetails[Number(el.dataset.i)];
      putt.flag = putt.flag === el.dataset.val ? "" : el.dataset.val;
      syncPutts(pfh);
      saveActive(); render(); return;
    }
    if (action === "prev-hole") {
      syncRoundMeta();
      state.active.cursor = Math.max(0, state.active.cursor - 1);
      seedHoleDefaults(state.active.holes[state.active.cursor]);
      saveActive(); render(); return;
    }
    if (action === "next-hole") {
      syncRoundMeta();
      state.active.cursor = Math.min(17, state.active.cursor + 1);
      seedHoleDefaults(state.active.holes[state.active.cursor]);
      saveActive(); render(); return;
    }
    if (action === "finish-round") {
      syncRoundMeta();
      state.rounds.push(state.active);
      saveRounds();
      state.active = null; writeJSON(LS.active, null);
      state.route = "stats"; render(); showToast("Runde lagret!"); return;
    }

    if (action === "range-set-power") { state.rangeForm.power = Number(el.dataset.power); render(); return; }
    if (action === "range-set-club") { state.rangeForm.club = el.dataset.club; render(); return; }
    if (action === "range-add-shot") {
      var rClub = state.rangeForm.club;
      var rLenInput = document.getElementById("range-len-input");
      var rLen = parseFloat(rLenInput.value);
      if (!rClub || !rLen || rLen <= 0) { showToast("Fyll inn lengde"); return; }
      state.rangeShots.push({ id: uid(), date: new Date().toISOString().slice(0, 10), club: rClub, power: state.rangeForm.power, len: Math.round(rLen) });
      saveRangeShots(); render(); return;
    }
    if (action === "range-remove-shot") {
      state.rangeShots = state.rangeShots.filter(function (s) { return s.id !== el.dataset.id; });
      saveRangeShots(); render(); return;
    }

    if (action === "copy-export") { copyExport(); return; }
    if (action === "download-export") { downloadExport(); return; }

    if (action === "cmp-parse") {
      state.compareInput = document.getElementById("cmp-input").value;
      writeJSON(LS.compareInput, state.compareInput);
      parseCompareInput(); render(); return;
    }
    if (action === "cmp-add-self") {
      var self = buildExportObject();
      self.name = self.name + " (deg)";
      state.comparePlayers.push(self);
      render(); return;
    }
    if (action === "cmp-remove") {
      state.comparePlayers.splice(Number(el.dataset.idx), 1); render(); return;
    }

    if (action === "remove-club") {
      state.profile.clubs = state.profile.clubs.filter(function (c) { return c.id !== el.dataset.id; });
      saveProfile(); render(); return;
    }
    if (action === "add-club") {
      var input = document.getElementById("st-new-club");
      var v = input.value.trim();
      if (v) { state.profile.clubs.push({ id: uid(), name: v }); saveProfile(); render(); }
      return;
    }
    if (action === "save-settings") {
      var nameInput = document.getElementById("st-name");
      state.profile.name = nameInput.value.trim() || state.profile.name;
      saveProfile(); state.route = "home"; render(); showToast("Lagret"); return;
    }
  }

  function syncRoundMeta() {
    var dateEl = document.getElementById("rd-date");
    var courseEl = document.getElementById("rd-course");
    if (dateEl) state.active.date = dateEl.value;
    if (courseEl) state.active.course = courseEl.value;
  }

  function copyExport() {
    var code = document.getElementById("export-code-box").textContent;
    var done = function () { showToast("Kode kopiert!"); };
    var fail = function () { showToast("Kunne ikke kopiere – merk og kopier manuelt"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, fail);
    } else {
      try {
        var ta = document.createElement("textarea");
        ta.value = code; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta); done();
      } catch (e) { fail(); }
    }
  }

  function downloadExport() {
    var code = document.getElementById("export-code-box").textContent;
    var name = (state.profile.name || "spiller").replace(/[^a-z0-9æøå]+/gi, "-").toLowerCase();
    if (window.claude && window.claude.use) {
      window.claude.use("downloads").then(function (downloads) {
        if (!downloads) { showToast("Nedlasting ikke tilgjengelig her"); return; }
        downloads.save({ filename: "golf-" + name + ".txt", data: code })
          .then(function () { showToast("Fil lagret"); })
          .catch(function () { showToast("Nedlasting avbrutt"); });
      });
    } else {
      showToast("Nedlasting ikke tilgjengelig her");
    }
  }

  /* ---------------- boot ---------------- */
  parseCompareInput();
  render();
})();
</script>
