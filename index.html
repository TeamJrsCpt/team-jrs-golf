<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Team Jr's Statistikkbank</title>
<style>
  :root {
    color-scheme: light;
    --bg-page:      #f9f9f7;
    --bg-surface:   #ffffff;
    --bg-card:      #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary:#52514e;
    --text-muted:   #898781;
    --border:       #e1e0d9;
    --border-strong:#c3c2b7;
    --accent:       #1baf7a;
    --accent-ink:   #ffffff;
    --accent-soft:  #e3f6ee;
    --danger:       #d03b3b;
    --danger-soft:  #fbe7e6;
    --seq-track:    #e1e0d9;
    --seq-bar:      #2a78d6;
    --seq-bar-2:    #86b6ef;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg-page:      #0d0d0d;
      --bg-surface:   #1a1a19;
      --bg-card:      #1f1f1e;
      --text-primary: #ffffff;
      --text-secondary:#c3c2b7;
      --text-muted:   #898781;
      --border:       #2c2c2a;
      --border-strong:#383835;
      --accent:       #22c78a;
      --accent-ink:   #06140f;
      --accent-soft:  #123326;
      --danger:       #e66767;
      --danger-soft:  #3a1f1f;
      --seq-track:    #2c2c2a;
      --seq-bar:      #3987e5;
      --seq-bar-2:    #184f95;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-page:      #0d0d0d;
    --bg-surface:   #1a1a19;
    --bg-card:      #1f1f1e;
    --text-primary: #ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:   #898781;
    --border:       #2c2c2a;
    --border-strong:#383835;
    --accent:       #22c78a;
    --accent-ink:   #06140f;
    --accent-soft:  #123326;
    --danger:       #e66767;
    --danger-soft:  #3a1f1f;
    --seq-track:    #2c2c2a;
    --seq-bar:      #3987e5;
    --seq-bar-2:    #184f95;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg-page); }
  #app-root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
    background: var(--bg-page);
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }
  h1, h2, h3 { margin: 0 0 4px 0; font-weight: 700; }
  p { margin: 0; }
  button { font-family: inherit; }
  .header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg-page);
    padding: 16px 16px 8px 16px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 20px; }
  .header .sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .header-hero {
    position: static; border-bottom: none;
    background-size: cover; background-position: center;
    padding: 30px 16px 18px 16px;
  }
  .header-hero h1, .header-hero .sub { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.55); }
  .content { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .card + .card { margin-top: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 46px; padding: 10px 16px;
    border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--bg-surface); color: var(--text-primary);
    font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
  .btn-sm { min-height: 36px; padding: 6px 12px; font-size: 13px; width: auto; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .stack { display: flex; flex-direction: column; gap: 8px; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-tile { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 8px; text-align: center; }
  .stat-tile .value { font-size: 22px; font-weight: 700; }
  .stat-tile .label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .toggle-group { display: flex; gap: 8px; }
  .toggle-btn {
    flex: 1; min-height: 46px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--bg-surface); color: var(--text-primary); font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .toggle-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .toggle-btn.danger-active { background: var(--danger); color: #fff; border-color: var(--danger); }

  .hole-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .hole-dot {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--border-strong); background: var(--bg-surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer;
  }
  .hole-dot.current { border-color: var(--accent); border-width: 2px; color: var(--text-primary); }
  .hole-dot.done { background: var(--accent-soft); color: var(--text-primary); }

  .loop-dot {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--border); cursor: pointer; padding: 0; position: relative;
  }
  .loop-dot.active { border-color: var(--text-primary); box-shadow: 0 0 0 2px var(--bg-card), 0 0 0 4px var(--text-primary); }
  .loop-dot.active::after {
    content: "✓"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 15px; text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .loop-dot-mini {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid var(--border-strong); flex: 0 0 auto;
  }

  .score-badge {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; font-weight: 700; font-size: 14px; color: var(--text-primary);
  }
  .score-birdie { border: 2px solid var(--accent); border-radius: 50%; }
  .score-eagle { border: 2px solid var(--accent); border-radius: 50%; box-shadow: 0 0 0 3px var(--bg-card), 0 0 0 5px var(--accent); margin: 0 2px; }
  .score-bogey { border: 2px solid var(--danger); border-radius: 5px; }
  .score-dbogey { border: 2px solid var(--danger); border-radius: 5px; box-shadow: 0 0 0 3px var(--bg-card), 0 0 0 5px var(--danger); margin: 0 2px; }
  .score-none { color: var(--text-muted); font-weight: 500; }

  .scorecard-scroll { overflow-x: auto; padding-bottom: 2px; }
  .scorecard-line { display: flex; align-items: center; gap: 4px; }
  .scorecard-line + .scorecard-line { margin-top: 4px; }
  .scorecard-cell { flex: 0 0 auto; width: 38px; display: flex; justify-content: center; }
  .sc-total-cell { width: 42px; }
  .sc-hole {
    font-size: 11px; font-weight: 700; color: #fff; background: var(--accent);
    border-radius: 5px; padding: 3px 0; width: 100%; text-align: center;
  }
  .sc-hole.sc-total-label { background: transparent; color: var(--text-muted); font-weight: 600; }
  .sc-par { font-size: 10px; color: var(--text-muted); text-align: center; width: 100%; }
  .sc-par.sc-total-value { font-size: 13px; font-weight: 700; color: var(--text-primary); }
  .sc-par-line { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 4px 0; }
  .sc-summary {
    display: flex; align-items: baseline; justify-content: center; flex-wrap: wrap; gap: 6px;
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 15px; font-weight: 700;
  }
  .sc-summary-big { font-size: 19px; font-weight: 800; }
  .sc-summary-sep { color: var(--text-muted); font-weight: 400; }
  .sc-summary-diff.sc-summary-under { color: var(--accent); }
  .sc-summary-diff.sc-summary-over { color: var(--danger); }
  .sc-summary-note { width: 100%; text-align: center; font-size: 11px; font-weight: 500; color: var(--text-muted); }
  .scorecard-nine + .scorecard-nine { margin-top: 12px; }
  .sc-legend { margin-top: 12px; font-size: 11px; color: var(--text-muted); text-align: center; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-soft); color: var(--text-primary);
    border-radius: 999px; padding: 6px 10px 6px 12px; font-size: 13px; font-weight: 500;
  }
  .chip button {
    border: none; background: transparent; color: var(--text-secondary); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 2px;
  }
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-penalty { background: var(--danger-soft); color: var(--danger); }

  /* ---- detaljert slag-/puttregistrering ---- */
  .entry { border: 1px solid var(--border); border-radius: 12px; padding: 10px 10px 12px 10px; margin-bottom: 8px; background: var(--bg-surface); }
  .entry-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .entry-head .num { font-size: 12.5px; font-weight: 700; color: var(--text-secondary); }
  .entry-head .num .dist { font-weight: 500; color: var(--text-muted); }
  .entry .row + .row { margin-top: 8px; }
  .entry.penalty-entry { background: var(--danger-soft); border-color: var(--danger); }
  .entry.penalty-entry .num { color: var(--danger); }
  .penalty-line { font-size: 12.5px; font-weight: 600; color: var(--danger); }
  .remove-btn { border: none; background: transparent; color: var(--text-muted); font-size: 17px; line-height: 1; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
  .remove-btn:hover { color: var(--danger); background: var(--danger-soft); }
  .add-btn { width: 100%; min-height: 42px; border-radius: 10px; border: 1px dashed var(--border-strong); background: transparent; color: var(--accent); font-weight: 700; font-size: 13.5px; cursor: pointer; margin-top: 2px; }
  .field.grow { flex: 1; }
  .putt-entry { border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 8px; background: var(--bg-surface); }
  .putt-row { display: flex; gap: 8px; align-items: flex-end; }
  .putt-result { display: flex; gap: 4px; }
  .pill-btn { flex: 0 0 auto; min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text-primary); font-weight: 700; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .pill-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .flag-note { margin-top: 8px; font-size: 11.5px; font-weight: 600; color: var(--accent); }
  .lost-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--danger); }
  .lost-row .lost-label { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }
  .lost-toggle { display: flex; gap: 6px; }
  .pill-btn.lost-yes.active { background: var(--danger); color: #fff; border-color: var(--danger); }
  .pill-btn.lost-no.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .drop-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-strong); }
  .drop-row .drop-label { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }
  .drop-toggle { display: flex; gap: 6px; }
  .pill-btn.drop-yes.active { background: var(--danger); color: #fff; border-color: var(--danger); }
  .hazard-note { margin-top: 8px; font-size: 11.5px; font-weight: 600; color: var(--text-muted); }
  .mode-toggle { display: flex; gap: 6px; margin-bottom: 4px; }
  .mode-btn { flex: 1; min-height: 38px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text-secondary); font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .mode-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .note-box { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; margin-bottom: 4px; font-size: 13px; line-height: 1.5; }
  .note-box b { color: var(--text-primary); }

  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--bg-surface); color: var(--text-primary); padding: 8px 12px; font-size: 15px;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }
  label { font-size: 12px; color: var(--text-secondary); font-weight: 600; display: block; margin-bottom: 4px; }
  .field { margin-bottom: 10px; }

  .nav-bar {
    position: sticky; bottom: 0;
    width: 100%;
    display: flex; background: var(--bg-surface); border-top: 1px solid var(--border);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)) 4px;
    z-index: 10;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 2px; border: none; background: transparent; color: var(--text-muted);
    font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 10px;
  }
  .nav-item .ic { font-size: 19px; }
  .nav-item.active { color: var(--accent); }

  .list-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row .meta { font-size: 12px; color: var(--text-muted); }

  .bar-row { margin-bottom: 10px; }
  .bar-row .bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .bar-track { background: var(--seq-track); border-radius: 6px; height: 10px; overflow: hidden; }
  .bar-fill { background: var(--seq-bar); height: 100%; border-radius: 6px 4px 4px 6px; }

  .banner {
    background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px;
    padding: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 8px;
  }
  .empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px 8px; line-height: 1.6; }
  .toast {
    position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: var(--bg-page);
    padding: 8px 16px; border-radius: 999px; font-size: 13px; z-index: 20;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .toast.show { opacity: 1; }
  .badge { font-size: 11px; background: var(--border); color: var(--text-secondary); border-radius: 999px; padding: 2px 8px; }
  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); margin-bottom: 6px; }
  .divider { height: 1px; background: var(--border); margin: 4px 0; }
  .pair-table { width: 100%; border-collapse: collapse; }
  .pair-table th, .pair-table td { text-align: left; padding: 6px 4px; font-size: 13px; border-bottom: 1px solid var(--border); }
  .pair-table th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .score-pill { display: inline-block; min-width: 34px; text-align: center; font-weight: 700; }
  code.export-code { display: block; word-break: break-all; font-size: 11px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px; max-height: 90px; overflow-y: auto; }
</style>

<div id="app-root"></div>
<div id="toast" class="toast"></div>

<script>
/* ---- auto-oppdatering forbi nettleser-cache ----
   GitHub Pages (og spesielt "Legg til på Hjem-skjerm"-snarveier på mobil) kan
   mellomlagre denne filen lenge etter at en ny versjon er lastet opp. Dette holder
   siden fersk automatisk, HELT uavhengig av og uten å røre localStorage (rundene/
   profilen ligger trygt i en egen lagringsboks som ikke er en del av dette):
   1. Ved hver sideåpning sjekkes filens ETag/Last-Modified rett mot serveren med
      cache: "no-store" (går alltid forbi nettleserens cache for akkurat dette kallet).
   2. Sammenlignes med forrige kjente verdi (lagret i localStorage under en egen,
      teknisk nøkkel - ikke i nærheten av spillernes egne data-nøkler).
   3. Er den ulik (dvs. en nyere fil faktisk ligger ute), tvinges én automatisk
      omlasting med en ny URL (?_v=...) som garantert henter frisk versjon.
   Feiler sjekken (frakoblet, gammel nettleser uten fetch, osv.) skjer ingenting -
   appen fungerer akkurat som før, bare uten auto-oppdateringen denne gangen. */
(function () {
  "use strict";
  try {
    if ("fetch" in window) {
      fetch(location.pathname, { method: "HEAD", cache: "no-store" }).then(function (r) {
        var tag = r.headers.get("etag") || r.headers.get("last-modified");
        if (!tag) return;
        var key = "golf_page_version_v1";
        var prev = localStorage.getItem(key);
        localStorage.setItem(key, tag);
        if (prev && prev !== tag) {
          location.replace(location.pathname + "?_v=" + Date.now());
        }
      }).catch(function () { /* offline e.l. - fortsett med siden vi allerede har */ });
    }
  } catch (e) { /* fetch/localStorage utilgjengelig - ignorer */ }
})();
</script>

<script>

  /* Kun disse slagtypene regnes som representative for kølla sin "normale" lengde,

     computeStats() og computeClubBreakdown() under. Rene mistreff (Chip, Shank,
     Topp, Snap hook, Hook, osv.) og ekstreme utslag (Slice) trekker snittet feil

  var DISTANCE_STAT_TYPES = ["Sweetspot", "Baby draw", "Draw", "Baby fade", "Fade"];
  function countsForDistanceStats(type) { return DISTANCE_STAT_TYPES.indexOf(type) !== -1; }
  var LANDING_SPOTS = ["Fairway", "Fairway bunker", "Rough", "Hazard", "Vann", "OB", "Fringe", "Green", "Green side bunker"];
  var PENALTY_LANDING_SPOTS = ["Vann", "OB"];
  function isPenaltyLanding(land) { return PENALTY_LANDING_SPOTS.indexOf(land) !== -1; }
  /* Hazard er ikke automatisk straffeslag slik Vann/OB er — der spør vi eksplisitt om
     ballen ble droppet. Droppes den (Ja), gir det straffeslag akkurat som Vann/OB.
     Svares Nei, eller står spørsmålet ubesvart, antas det at neste slag spilles
     direkte fra hazard uten straffeslag. */
  function shotCausesPenalty(shot) {
    return isPenaltyLanding(shot.land) || (shot.land === "Hazard" && shot.drop === "Ja");
  }
  function penaltyLabel(shot) {
    return shot.land === "Hazard" ? "Drop fra hazard" : shot.land;
  }
  function shotsPenaltyCount(h) {
    return (h.shots || []).filter(shotCausesPenalty).length;

  /* h.shots inneholder kun ekte, redigerbare slag. Straffeslag-rader avledes ved
     rendering (lagres ikke i state), slik at data-i alltid peker rett inn i h.shots.
     Slaget som gikk i Vann/OB/hazard-drop beholder sitt nummer, straffeslaget blir
     det neste, og alle ekte slag etter det nummereres automatisk på nytt. */
  function buildShotSequence(h) {
    var out = [], num = 1;
    (h.shots || []).forEach(function (shot, ri) {
      out.push({ type: "shot", ri: ri, num: num, shot: shot });
      num++;
      if (shotCausesPenalty(shot)) {
        out.push({ type: "penalty", num: num, land: penaltyLabel(shot), shotRi: ri, lostBall: shot.lostBall || "" });
        num++;
      }
    });
    return out;
  }
  /* Fairway-treff avgjøres av landingspunktet på slag 1 (utslaget) for par 4/5.
     Eldre runder (før denne omleggingen) mangler landingspunkt og faller tilbake
     på det gamle "Traff du fairway?"-feltet. */
  function holeFairwayHit(h) {
    if (h.shots && h.shots[0] && h.shots[0].land) {
      var land0 = h.shots[0].land;
      return land0 === "Fairway" || land0 === "Fairway bunker";
    }
    if (h.fairway) return h.fairway === "yes";
    return false;
  }
  /* Putter: "enkel" er rask telling (1–5 knapper), "detaljert" er distanse +
     Gimme/Tap-in/Made per putt-rad. h.putts holdes alltid synkronisert som det
     endelige tallet uansett modus, slik at all annen statistikk (GIR, snitt putter
     osv.) fortsatt kan lese h.putts direkte som et rent tall, som før. */
  function visiblePutts(h) {
    var out = [], details = h.puttDetails || [];
    for (var i = 0; i < details.length; i++) {
      out.push(details[i]);
      if (details[i].flag) break;
    }
    return out;
  }
  /* Beskrivende hull-oppsummering (brukes under "tidligere runder"): bygger en
     lesbar tekst av slagene og puttene på hullet i stedet for en stikkords-liste.
     Gjenbruker buildShotSequence/visiblePutts slik at rekkefølgen - inkludert
     straffeslag - blir riktig uten å duplisere den logikken her.
     Mønster (basert på eksempel fra Anders): slag 1 nevner lengde + slagtype
     ("225 meter sweet spot til fairway"), slag 2+ nevner kølle i stedet for
     lengde ("7-jern approach til green" for et rent slag, "PW shank til rough"
     for et mistreff), putter kjedes som avstand-til-neste ("15 meter putt til
     2 meter"), og siste putt blir "Senker X meter putt". */
  function shotTypeLabel(type) {
    return type === "Sweetspot" ? "sweet spot" : String(type || "").toLowerCase();
  }
  function landLabel(land) {
    if (!land) return "";
    return land === "OB" ? "OB" : land.toLowerCase();
  }
  function holeNarrative(h) {
    var clauses = [];
    buildShotSequence(h).forEach(function (item) {
      if (item.type === "penalty") {
        clauses.push("Straffeslag (" + item.land + ")");
        if (item.lostBall === "Ja") clauses.push("Mistet ballen");
        return;
      }
      var sh = item.shot;
      if (!sh.club && !sh.land) return;
      var land = landLabel(sh.land);
      if (item.ri === 0) {
        var lenPart = sh.len ? sh.len + " meter " : "";
        clauses.push((lenPart + shotTypeLabel(sh.type) + (land ? " til " + land : "")).trim());
      } else if (sh.type === "Sweetspot") {
        clauses.push((sh.club || "Slag") + " approach" + (land ? " til " + land : ""));
      } else {
        clauses.push((sh.club || "Slag") + " " + shotTypeLabel(sh.type) + (land ? " til " + land : ""));
      }
    });
    if (h.puttMode === "detaljert") {
      var visible = visiblePutts(h);
      visible.forEach(function (p, i) {
        var isLast = i === visible.length - 1;
        var holed = isLast && (p.flag === "Made" || p.flag === "Gimme" || p.flag === "Tap-in");
        if (holed) {
          clauses.push(p.dist ? "Senker " + p.dist + " meter putt" : "Senker putten");
        } else if (!isLast && p.dist && visible[i + 1].dist) {
          clauses.push(p.dist + " meter putt til " + visible[i + 1].dist + " meter");
        } else if (p.dist) {
          clauses.push(p.dist + " meter putt");
        }
      });
    } else if (typeof h.putts === "number" && h.putts > 0) {
      clauses.push(h.putts + (h.putts === 1 ? " putt" : " putter"));
    }
    if (!clauses.length) return "";
    var text = clauses.join(". ") + ".";
    return text.charAt(0).toUpperCase() + text.slice(1);
  }
  function syncPutts(h) {
    if (h.puttMode === "detaljert") {
      var visible = visiblePutts(h);
      var last = visible[visible.length - 1];
      var bonus = last && (last.flag === "Gimme" || last.flag === "Tap-in") ? 1 : 0;
      h.putts = visible.length + bonus;
    } else {
      h.putts = h.enkelCount;
    }
  }
  function defaultShotsForPar(par) {
    if (par === 3) return [{ club: "7-jern", len: "", type: "Sweetspot", land: "Green" }];
    if (par === 4) return [
      { club: "Driver", len: "", type: "Sweetspot", land: "Fairway" },
      { club: "7-jern", len: "", type: "Sweetspot", land: "Green" }
    ];
    if (par === 5) return [
      { club: "Driver", len: "", type: "Sweetspot", land: "Fairway" },
      { club: "7-jern", len: "", type: "Sweetspot", land: "Fairway" },
      { club: "PW", len: "", type: "Sweetspot", land: "Green" }
    ];
    return [];
  }
  /* Fyller inn standard slag-/putt-antagelser (par 4 → 2 slag, par 5 → 3 slag,
     alltid 2 putter) første gang brukeren faktisk går inn på et hull som har fått
     par — IKKE når en ferdigbane bare fyller par på alle 18 hull på forhånd (da
     ville alle 18 hull sett "spilt" ut med én gang). Rører aldri et hull som
     allerede har registrerte slag. */
  function seedHoleDefaults(h) {
    if (!h || !h.par || (h.shots && h.shots.length)) return;
    h.shots = defaultShotsForPar(h.par);
    if (!h.puttMode) h.puttMode = "enkel";
    if (h.enkelCount == null) h.enkelCount = 2;
    if (!h.puttDetails || !h.puttDetails.length) h.puttDetails = [{ dist: "", flag: "" }, { dist: "", flag: "" }];
    syncPutts(h);
  }

  var state = {
    profile: readJSON(LS.profile, null),
    rounds: readJSON(LS.rounds, []),
    active: readJSON(LS.active, null),
    route: "home",
    routeParams: {},
    compareInput: readJSON(LS.compareInput, ""),
    comparePlayers: [],
    compareErrors: [],
    rangeShots: readJSON(LS.range, []),
    rangeForm: { power: 100 },
    unlocked: readJSON(LS.unlocked, false),
    confirm: null /* {message, onYes} */
  };

  function saveProfile() { writeJSON(LS.profile, state.profile); }
  function saveRounds() { writeJSON(LS.rounds, state.rounds); }
  function saveActive() { writeJSON(LS.active, state.active); }
  function saveRangeShots() { writeJSON(LS.range, state.rangeShots); }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1800);

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function round1(n) { return Math.round(n * 10) / 10; }
  function round2(n) { return Math.round(n * 100) / 100; }

  /* ---------------- base64 helpers (safe for æøå) ---------------- */
  function toBase64(obj) {
    var json = JSON.stringify(obj);
    var bytes = new TextEncoder().encode(json);
    var binary = "";
    for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
  function fromBase64(b64) {
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    var json = new TextDecoder().decode(bytes);
    return JSON.parse(json);
  }
  var EXPORT_PREFIX = "GOLF1:";

  /* ---------------- stats ---------------- */
  function computeStats(rounds) {
    var holes = [];
    /* Kun hull som faktisk er spilt (har registrert minst ett slag/putt) telles med.
       Ved forhåndsdefinert bane fylles par ut for alle 18 hull med en gang, så uten
       denne sjekken ville en avsluttet/delvis runde blitt utvannet av upåbegynte hull
       (samme "faktisk spilt"-definisjon som scorekortets projiserte sluttsum bruker). */
    rounds.forEach(function (r) { r.holes.forEach(function (h) { if (h.par && holeStrokes(h)) holes.push(h); }); });
    var fairwayHoles = holes.filter(function (h) { return h.par === 4 || h.par === 5; });
    var fairwayHits = fairwayHoles.filter(holeFairwayHit).length;
    var fairwayPct = fairwayHoles.length ? (fairwayHits / fairwayHoles.length) * 100 : null;
    var totalPutts = holes.reduce(function (sum, h) { return sum + (typeof h.putts === "number" ? h.putts : 0); }, 0);
    var puttedHoles = holes.filter(function (h) { return typeof h.putts === "number"; }).length;
    var avgPuttsPerHole = puttedHoles ? totalPutts / puttedHoles : null;
    /* Tapte baller telles per slag (nytt "Mistet du ballen?"-valg på straffeslag),
       pluss et fallback-tall for eldre runder som brukte den gamle lost_ball-taggen. */
    var lostBalls = 0;
    holes.forEach(function (h) {
      (h.shots || []).forEach(function (s) { if (s.lostBall === "Ja") lostBalls++; });
      if (h.missTypes && h.missTypes.indexOf("lost_ball") !== -1) lostBalls++;
    });
    /* GIR (Green in Regulation): etter brukerens definisjon telles hullet som GIR
       når man scorer par med nøyaktig 2 putter (tilsvarer å ha nådd green på par-2 slag). */
    var girHoles = holes.filter(function (h) { return holeStrokes(h) === h.par && h.putts === 2; });
    var girPct = holes.length ? (girHoles.length / holes.length) * 100 : null;

    var clubMap = {};
    holes.forEach(function (h) {
      (h.shots || []).forEach(function (s) {
        var len = parseFloat(s.len);
        if (!s.club || !len || !countsForDistanceStats(s.type)) return;
        if (!clubMap[s.club]) clubMap[s.club] = { name: s.club, sum: 0, n: 0 };
        clubMap[s.club].sum += len;
        clubMap[s.club].n += 1;
      });
    });
    var clubs = Object.keys(clubMap).map(function (k) {
      var c = clubMap[k];
      return { name: c.name, avg: c.sum / c.n, n: c.n };
    }).sort(function (a, b) { return b.avg - a.avg; });

    return {
      roundsCount: rounds.length,
      holesCount: holes.length,
      fairwayHoles: fairwayHoles.length,
      fairwayHits: fairwayHits,
      fairwayPct: fairwayPct,
      avgPuttsPerHole: avgPuttsPerHole,
      totalPutts: totalPutts,
      lostBalls: lostBalls,
      girCount: girHoles.length,
      girPct: girPct,
      clubs: clubs
    };
  }

  /* Kølledata fra runder (antatt fullt slag) + driving range (fullt/75%/50%),
     slått sammen per kølle slik at "fullt slag"-snittet bruker begge kilder. */
  function computeClubBreakdown(rounds, rangeShots) {
    var map = {};
    function ensure(name) {
      if (!map[name]) map[name] = { 100: { sum: 0, n: 0 }, 75: { sum: 0, n: 0 }, 50: { sum: 0, n: 0 } };
      return map[name];
    }
    rounds.forEach(function (r) {
      r.holes.forEach(function (h) {
        (h.shots || []).forEach(function (s) {
          var len = parseFloat(s.len);
          if (!s.club || !len || !countsForDistanceStats(s.type)) return;
          var m = ensure(s.club);
          m[100].sum += len; m[100].n += 1;
        });
      });
    });
    rangeShots.forEach(function (s) {
      var m = ensure(s.club);
      var bucket = m[s.power];
      if (bucket) { bucket.sum += s.len; bucket.n += 1; }
    });
    function avgOf(b) { return b.n ? b.sum / b.n : null; }
    return Object.keys(map).map(function (name) {
      var m = map[name];
      return {
        name: name,
        full: { avg: avgOf(m[100]), n: m[100].n },
        p75: { avg: avgOf(m[75]), n: m[75].n },
        p50: { avg: avgOf(m[50]), n: m[50].n }
      };
    }).sort(function (a, b) { return (b.full.avg || 0) - (a.full.avg || 0); });
  }

  /* Teller opp hvor mange ganger hver slagtype er registrert på tvers av alle
     runder - uavhengig av om slaget teller med i distansestatistikken (se
     countsForDistanceStats over). Dette skal vise den faktiske fordelingen av
     slagtyper (f.eks. hvor ofte man treffer sweetspot vs. baby draw vs. shank),
     ikke bare de "rene" slagene som teller mot lengdesnittet. */
  function computeShotTypeBreakdown(rounds) {
    var counts = {};
    SHOT_TYPES.forEach(function (t) { counts[t] = 0; });
    rounds.forEach(function (r) {
      r.holes.forEach(function (h) {
        (h.shots || []).forEach(function (s) {
          if (s.type && counts.hasOwnProperty(s.type)) counts[s.type] += 1;
        });
      });
    });
    return SHOT_TYPES.map(function (t) { return { type: t, n: counts[t] }; })
      .filter(function (x) { return x.n > 0; })
      .sort(function (a, b) { return b.n - a.n; });
  }

  /* Snittscore (antall slag = registrerte slag + putter) gruppert på par 3/4/5.
     Kun hull med minst ett registrert slag/putt telles med. */
  function computeScoreByPar(rounds) {
    var groups = { 3: { sum: 0, n: 0 }, 4: { sum: 0, n: 0 }, 5: { sum: 0, n: 0 } };
    rounds.forEach(function (r) {
      r.holes.forEach(function (h) {
        if (!h.par || !groups[h.par]) return;
        var strokes = (h.shots ? h.shots.length : 0) + shotsPenaltyCount(h) + (typeof h.putts === "number" ? h.putts : 0);
        if (strokes <= 0) return;
        groups[h.par].sum += strokes; groups[h.par].n += 1;
      });
    });
    return groups;
  }

  function buildExportObject() {
    var stats = computeStats(state.rounds);
    var clubBreakdown = computeClubBreakdown(state.rounds, state.rangeShots).filter(function (c) { return c.full.n > 0; });
    return {
      v: 1,
      name: state.profile ? state.profile.name : "Ukjent",
      rounds: stats.roundsCount,
      holes: stats.holesCount,
      fairwayPct: stats.fairwayPct == null ? null : round1(stats.fairwayPct),
      fairwayHoles: stats.fairwayHoles,
      avgPutts: stats.avgPuttsPerHole == null ? null : round2(stats.avgPuttsPerHole),
      clubs: clubBreakdown.map(function (c) { return { name: c.name, avg: round1(c.full.avg), n: c.full.n }; })
    };
  }

  function parseExportCode(raw) {
    var line = raw.trim();
    if (!line) return null;
    if (line.indexOf(EXPORT_PREFIX) !== 0) throw new Error("Mangler riktig kodeformat");
    var obj = fromBase64(line.slice(EXPORT_PREFIX.length));
    if (!obj || typeof obj !== "object" || !obj.name || !Array.isArray(obj.clubs)) throw new Error("Ugyldig innhold i koden");
    return obj;
  }

  /* ---------------- pairing model ---------------- */
  function driveDist(p) {
    var driver = p.clubs.find(function (c) { return /driver/i.test(c.name); });
    if (driver) return driver.avg;
    if (p.clubs.length) return Math.max.apply(null, p.clubs.map(function (c) { return c.avg; }));
    return 0;
  }
  function normalizer(values) {
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (max === min) return function () { return 50; };
    return function (v) { return ((v - min) / (max - min)) * 100; };
  }
  function computePairings(players) {
    var drives = players.map(driveDist);
    var fairways = players.map(function (p) { return p.fairwayPct == null ? 50 : p.fairwayPct; });
    var putts = players.map(function (p) { return p.avgPutts == null ? 2 : p.avgPutts; });
    var nDrive = normalizer(drives);
    var nFairway = normalizer(fairways);
    var maxPutts = Math.max.apply(null, putts);
    var invPutts = putts.map(function (v) { return maxPutts - v; });
    var nPutt = normalizer(invPutts);

    var metrics = players.map(function (p, i) {
      return { drive: nDrive(drives[i]), fairway: nFairway(fairways[i]), putt: nPutt(invPutts[i]) };
    });

    var pairs = [];
    for (var i = 0; i < players.length; i++) {
      for (var j = i + 1; j < players.length; j++) {
        var a = metrics[i], b = metrics[j];
        var teeStrength = 0.5 * Math.max(a.drive, b.drive) + 0.5 * Math.max(a.fairway, b.fairway);
        var scramble = 0.4 * Math.max(a.drive, b.drive) + 0.3 * Math.max(a.fairway, b.fairway) + 0.3 * Math.max(a.putt, b.putt);
        var greensomePlay = 0.5 * ((a.fairway + b.fairway) / 2) + 0.5 * ((a.putt + b.putt) / 2);
        var greensome = 0.5 * teeStrength + 0.5 * greensomePlay;
        var shambleAfter = 0.5 * Math.max(a.putt, b.putt) + 0.5 * Math.max(a.fairway, b.fairway);
        var shamble = 0.4 * teeStrength + 0.6 * shambleAfter;
        pairs.push({
          a: players[i].name, b: players[j].name,
          scramble: round1(scramble), greensome: round1(greensome), shamble: round1(shamble),
          detail: { a: metrics[i], b: metrics[j] }
        });
      }
    }
    return pairs;
  }

  /* ---------------- rendering ---------------- */
  var root = document.getElementById("app-root");

  function render() {
    if (!state.unlocked) { root.innerHTML = renderLock(); bindLock(); return; }
    if (!state.profile) { root.innerHTML = renderOnboarding(); bindOnboarding(); return; }
    var html = renderHeader() + '<div class="content">';
    if (state.route === "home") html += renderHome();
    else if (state.route === "round") html += renderRound();
    else if (state.route === "roundDetail") html += renderRoundDetail(state.routeParams.id);
    else if (state.route === "range") html += renderRange();
    else if (state.route === "stats") html += renderStats();
    else if (state.route === "compare") html += renderCompare();
    else if (state.route === "settings") html += renderSettings();
    html += "</div>" + renderNav();
    root.innerHTML = html;
    bindGlobal();
  }

  function renderOnboarding() {
